<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberblock">
<meta name="theme-color" content="#0b0e12">
<title>Emberblock 100</title>
<style>
  :root{
    --bg-void:#0b0e12;
    --bg-void-2:#141922;
    --panel:#161b22;
    --panel-edge:#0a0c10;
    --cell-empty:#202730;
    --cell-empty-hi:#2a323d;
    --ember-hi:#ffc2e8;
    --ember-mid:#dcb0e8;
    --ember-low:#b8d0f7;
    --glow-rgb:216,160,224;
    --text:#f1ece1;
    --text-dim:#8d99a6;
    --sage:#7a9a73;
    --star:#f2c94c;
    --danger:#c1503a;
    --ghost-valid: rgba(122,154,115,.55);
    --ghost-invalid: rgba(193,80,58,.55);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    min-height:100%;
    min-height:100vh;
    min-height:100dvh;
    min-height:var(--real-vh, 100dvh);
    margin:0;
    overscroll-behavior:none;
    touch-action:manipulation;
    background:var(--bg-void);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100%;
    min-height:100vh;
    min-height:100dvh;
    min-height:var(--real-vh, 100dvh);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(ellipse at 50% -10%, #1c2430 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--bg-void-2) 100%);
    user-select:none;
  }

  #app{
    width:100%;
    max-width:480px;
    padding:18px 14px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .stars{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--panel);
    border:1px solid #262e39;
    border-radius:10px;
    padding:7px 12px;
    font-size:15px;
    font-weight:700;
    color:var(--star);
  }
  .stars.pulse{ animation:pulse 0.6s ease; }
  @keyframes pulse{
    0%{ text-shadow:0 0 0 rgba(242,201,76,0); }
    40%{ text-shadow:0 0 14px rgba(242,201,76,.9); }
    100%{ text-shadow:0 0 0 rgba(242,201,76,0); }
  }
  .best-row{
    text-align:center;
    color:var(--sage);
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin-top:-6px;
  }
  .best-row.pulse{ animation:pulse-sage 0.6s ease; }
  @keyframes pulse-sage{
    0%{ text-shadow:0 0 0 rgba(122,154,115,0); }
    40%{ text-shadow:0 0 14px rgba(122,154,115,.9); }
    100%{ text-shadow:0 0 0 rgba(122,154,115,0); }
  }
  .best-row b{ color:var(--text); font-size:13px; }
  .score-block{ text-align:center; flex:1; }
  .score{
    font-size:44px;
    font-weight:800;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    text-shadow:0 0 24px rgba(var(--glow-rgb),.25);
  }
  .score-label{
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-top:2px;
  }
  .icon-btn{
    background:var(--panel);
    border:1px solid #262e39;
    color:var(--text-dim);
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .icon-btn:active{ transform:scale(.94); }

  /* ---------- board ---------- */
  #board-wrap{
    background:var(--panel);
    border-radius:18px;
    padding:10px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.03),
      inset 0 -6px 18px var(--panel-edge),
      0 12px 30px rgba(0,0,0,.45);
  }
  #board{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
    gap:3px;
    aspect-ratio:1/1;
    touch-action:none;
  }
  .cell{
    border-radius:5px;
    background:var(--cell-empty);
    box-shadow:inset 0 1px 0 var(--cell-empty-hi), inset 0 -2px 4px rgba(0,0,0,.35);
    position:relative;
  }
  .cell.filled{
    background:linear-gradient(135deg, var(--ember-hi) 0%, var(--ember-mid) 50%, var(--ember-low) 100%);
    box-shadow: 0 0 8px 2px rgba(var(--glow-rgb),.4);
  }
  .cell.preview-valid{ background:var(--ghost-valid); box-shadow:inset 0 0 0 2px rgba(122,154,115,.9); }
  .cell.preview-invalid{ background:var(--ghost-invalid); box-shadow:inset 0 0 0 2px rgba(193,80,58,.9); }
  .cell.clearing{ animation:crack .38s ease forwards; z-index:2; }
  @keyframes crack{
    0%{ filter:brightness(1); transform:scale(1); }
    35%{ filter:brightness(2.2); transform:scale(1.05); }
    100%{ filter:brightness(2.6); transform:scale(.5); opacity:0; }
  }

  /* ---------- tray ---------- */
  #tray-wrap{
    background:var(--panel);
    border-radius:18px;
    padding:14px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.03),
      inset 0 -6px 18px var(--panel-edge),
      0 12px 30px rgba(0,0,0,.45);
  }
  .tray-slot{
    flex:1;
    height:88px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    border-radius:12px;
  }
  .tray-slot.rotatable{
    box-shadow: inset 0 0 0 2px rgba(var(--glow-rgb),.5);
    animation: rotatable-pulse 1.6s ease-in-out infinite;
  }
  @keyframes rotatable-pulse{
    0%,100%{ box-shadow: inset 0 0 0 2px rgba(var(--glow-rgb),.25); }
    50%{ box-shadow: inset 0 0 0 2px rgba(var(--glow-rgb),.8); }
  }
  .tray-piece{ display:grid; gap:3px; }
  .tray-piece .tcell{
    width:20px;height:20px;
    border-radius:4px;
    background:transparent;
  }
  .tray-piece .tcell.on{
    background:linear-gradient(135deg, var(--ember-hi) 0%, var(--ember-mid) 50%, var(--ember-low) 100%);
    box-shadow: 0 0 6px 1px rgba(var(--glow-rgb),.4);
  }
  .tray-slot.dragging .tray-piece{ opacity:.18; }
  .tray-slot.empty-slot{ opacity:0; }

  /* ---------- controls ---------- */
  #controls{ display:flex; gap:10px; }
  .btn{
    flex:1;
    background:var(--panel);
    border:1px solid #262e39;
    color:var(--text);
    padding:12px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.4; }

  /* ---------- drag ghost ---------- */
  #ghost{
    position:fixed;
    top:0; left:0;
    display:grid;
    gap:3px;
    pointer-events:none;
    z-index:50;
    opacity:0;
  }
  #ghost .gcell{ border-radius:5px; }
  #ghost .gcell.on{
    background:linear-gradient(135deg, var(--ember-hi) 0%, var(--ember-mid) 50%, var(--ember-low) 100%);
    box-shadow: 0 0 10px 2px rgba(var(--glow-rgb),.45);
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,8,11,.78);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:24px;
  }
  .overlay.hidden{ display:none; }
  .modal{
    background:var(--panel);
    border-radius:18px;
    padding:24px;
    width:100%;
    max-width:360px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .modal h2{ margin:0 0 6px; font-size:22px; }
  .modal p{ color:var(--text-dim); font-size:14px; line-height:1.5; }
  .modal .final-score{ font-size:40px; font-weight:800; color:var(--ember-hi); margin:10px 0; }
  .modal textarea{
    width:100%; height:80px; margin:12px 0;
    background:var(--cell-empty); color:var(--text-dim);
    border:1px solid #2e3742; border-radius:10px;
    font-size:11px; padding:8px; resize:none;
  }
  .modal .row{ display:flex; gap:8px; margin-top:6px; }
  .modal .row .btn{ margin:0; }
  .modal .close-x{
    float:right; background:none; border:none; color:var(--text-dim);
    font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="stars" id="starsWrap"><svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px" aria-hidden="true"><defs><linearGradient id="starGradHeader" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff5cc4"/><stop offset="50%" stop-color="#b85cf0"/><stop offset="100%" stop-color="#5c9dff"/></linearGradient></defs><path fill="url(#starGradHeader)" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg> <span id="starsEl">0</span></div>

<div class="overlay hidden" id="gameoverOverlay">

</div>

    <textarea id="backupCode" readonly></textarea>
    <div class="row">
      <button class="btn" id="copyBackupBtn">Copy Code</button>

    <textarea id="restoreCode" placeholder="Paste your backup code here"></textarea>
    <div class="row">
      <button class="btn" id="restoreBtn">Restore</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="leaderboardOverlay">
  <div class="modal">
    <button class="close-x" id="leaderboardCloseBtn">&times;</button>
    <h2>Leaderboard</h2>
    <p id="leaderboardStatus">Loading&hellip;</p>
    <div id="leaderboardList" style="text-align:left; margin:14px 0;"></div>
    <div class="row">
      <button class="btn" id="changeNameBtn">Change name</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>
(function(){
  "use strict";

  function setRealViewportHeight(){
    document.documentElement.style.setProperty("--real-vh", window.innerHeight + "px");
  }
  setRealViewportHeight();
  window.addEventListener("resize", setRealViewportHeight);
  window.addEventListener("orientationchange", setRealViewportHeight);

  var SIZE = 10;
  var STORAGE_KEY = "emberblock100_save_v2";
  var OLD_STORAGE_KEY = "emberblock100_save_v1";
  var STAR_THRESHOLD = 80;
  var ROTATION_COST = 50;
  var CONTINUE_COST = 50;
  var STAR_ICON_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px" aria-hidden="true"><defs><linearGradient id="starGradRotate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff5cc4"/><stop offset="50%" stop-color="#b85cf0"/><stop offset="100%" stop-color="#5c9dff"/></linearGradient></defs><path fill="url(#starGradRotate)" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';

  /* ---------------- shape definitions ---------------- */
  var BASE_RAW_SHAPES = [
    ["#"],                              // 0 single block
    ["##"],                             // 1 domino
    ["###"],                            // 2 tromino, straight
    ["####"],                           // 3 tetromino I
    ["##","##"],                        // 4 tetromino O (2x2 square)
    ["#####"],                          // 5 pentomino I
    ["###","#..","#.."],                // 6 pentomino L / V (3 down + 3 across, sharing the corner)
    ["###","###","###"],                // 7 3x3 block (9 cells)
    ["##","#."]                         // 8 tromino, corner/L
  ];

  function parseShape(rows){
    var cells = [];
    var h = rows.length, w = 0;
    for (var r=0;r<rows.length;r++){
      w = Math.max(w, rows[r].length);
      for (var c=0;c<rows[r].length;c++){
        if (rows[r][c] === "#") cells.push([r,c]);
      }
    }
    return { cells: cells, w: w, h: h };
  }

  function rotateShape(shape){
    var h = shape.h;
    var newCells = shape.cells.map(function(cell){
      var r = cell[0], c = cell[1];
      return [c, h-1-r];
    });
    return { cells: newCells, w: shape.h, h: shape.w };
  }

  var BASE_SHAPES = BASE_RAW_SHAPES.map(parseShape);

  // ROTATIONS[baseId] = [rot0, rot1, rot2, rot3]
  var ROTATIONS = BASE_SHAPES.map(function(base){
    var list = [base];
    for (var i=0;i<3;i++) list.push(rotateShape(list[list.length-1]));
    return list;
  });

  function getShape(piece){
    var rotations = ROTATIONS[piece.baseId];
    if (!rotations) return ROTATIONS[0][0];
    return rotations[piece.rot] || rotations[0];
  }

  // repairs tray pieces left over from an older shape set (avoids crashing on stale saves)
  function sanitizePiece(piece){
    if (!piece) return null;
    if (typeof piece.baseId !== "number" || !ROTATIONS[piece.baseId]){
      return { baseId: randomBaseId(), rot: 0 };
    }
    if (typeof piece.rot !== "number" || piece.rot < 0 || piece.rot > 3){
      piece.rot = 0;
    }
    return piece;
  }

  // weighted bag so small pieces show up more often than big ones
  var WEIGHTED_POOL = [];
  BASE_SHAPES.forEach(function(shape, idx){
    var n = shape.cells.length;
    var weight = n <= 2 ? 3 : (n <= 4 ? 2 : 1);
    for (var i=0;i<weight;i++) WEIGHTED_POOL.push(idx);
  });

  function randomBaseId(){
    return WEIGHTED_POOL[Math.floor(Math.random()*WEIGHTED_POOL.length)];
  }

  // how many of the 4 rotations actually look different, per base shape
  // (e.g. the 2x2 and 3x3 blocks look identical in every rotation, period 1;
  //  a domino has period 2; the corner tromino and V-pentomino have period 4)
  function shapesEqual(a, b){
    if (a.cells.length !== b.cells.length) return false;
    var normA = a.cells.map(function(c){ return c[0]+","+c[1]; }).sort().join(";");
    var normB = b.cells.map(function(c){ return c[0]+","+c[1]; }).sort().join(";");
    return normA === normB;
  }
  var PERIOD = BASE_SHAPES.map(function(base, idx){
    for (var k=1;k<4;k++){
      if (shapesEqual(ROTATIONS[idx][k], ROTATIONS[idx][0])) return k;
    }
    return 4;
  });

  /* ---------------- state ---------------- */
  var board = [];
  var tray = [null,null,null]; // {baseId, rot} or null
  var score = 0;
  var best = 0;
  var stars = 0;
  var pointsSinceLastStar = 0;
  var clearedSinceLastStar = false;
  var bigClearSinceLastStar = false;
  var rotationCharges = 0;
  var hasUsedContinueThisGame = false;

  function newBoard(){
    var b = [];
    for (var r=0;r<SIZE;r++){ b.push(new Array(SIZE).fill(false)); }
    return b;
  }

  function refillTray(){
    var used = {};
    for (var i=0;i<3;i++){
      var baseId, rot, key, attempts = 0;
      do {
        baseId = randomBaseId();
        rot = Math.floor(Math.random()*4);
        key = baseId + "_" + (rot % PERIOD[baseId]);
        attempts++;
      } while (used[key] && attempts < 50);
      used[key] = true;
      tray[i] = { baseId: baseId, rot: rot };
    }
  }

  /* ---------------- persistence ---------------- */
  function safeGet(key){
    try { return localStorage.getItem(key); } catch(e){ return null; }
  }
  function safeSet(key,val){
    try { localStorage.setItem(key,val); return true; } catch(e){ return false; }
  }

  function serializeState(){
    return JSON.stringify({
      board: board.map(function(row){ return row.map(function(v){ return v?1:0; }); }),
      tray: tray,
      score: score,
      best: best,
      stars: stars,
      pointsSinceLastStar: pointsSinceLastStar,
      clearedSinceLastStar: clearedSinceLastStar,
      bigClearSinceLastStar: bigClearSinceLastStar,
      rotationCharges: rotationCharges,
      hasUsedContinueThisGame: hasUsedContinueThisGame,
      v: 2
    });
  }

  function save(){
    safeSet(STORAGE_KEY, serializeState());
  }

  function applyState(obj){
    board = obj.board.map(function(row){ return row.map(function(v){ return !!v; }); });
    tray = obj.tray.map(sanitizePiece);
    score = obj.score || 0;
    best = obj.best || 0;
    stars = obj.stars || 0;
    pointsSinceLastStar = obj.pointsSinceLastStar || 0;
    clearedSinceLastStar = !!obj.clearedSinceLastStar;
    bigClearSinceLastStar = !!obj.bigClearSinceLastStar;
    rotationCharges = obj.rotationCharges || 0;
    hasUsedContinueThisGame = !!obj.hasUsedContinueThisGame;
  }

  function loadOrInit(){
    var raw = safeGet(STORAGE_KEY);
    if (raw){
      try {
        var obj = JSON.parse(raw);
        if (obj && obj.board && obj.board.length === SIZE) {
          applyState(obj);
          return;
        }
      } catch(e){ /* fall through to fresh game */ }
    }
    // no v2 save yet - fresh state, but carry over a best score from an old v1 save if one exists
    board = newBoard();
    score = 0;
    stars = 0;
    pointsSinceLastStar = 0;
    clearedSinceLastStar = false;
    bigClearSinceLastStar = false;
    rotationCharges = 0;
    hasUsedContinueThisGame = false;
    var oldRaw = safeGet(OLD_STORAGE_KEY);
    if (oldRaw){
      try {
        var oldObj = JSON.parse(oldRaw);
        if (oldObj && typeof oldObj.best === "number") best = oldObj.best;
      } catch(e){ /* ignore */ }
    }
    refillTray();
    save();
  }

  /* ---------------- DOM refs ---------------- */
  var boardEl = document.getElementById("board");
  var scoreEl = document.getElementById("scoreEl");
  var bestEl = document.getElementById("bestEl");
  var bestWrap = document.getElementById("bestWrap");
  var starsEl = document.getElementById("starsEl");
  var starsWrap = document.getElementById("starsWrap");
  var rotateBtn = document.getElementById("rotateBtn");
  var restartBtn = document.getElementById("restartBtn");
  var ghostEl = document.getElementById("ghost");
  var gameoverOverlay = document.getElementById("gameoverOverlay");
  var finalScoreEl = document.getElementById("finalScoreEl");
  var newBestMsg = document.getElementById("newBestMsg");
  var continueRow = document.getElementById("continueRow");
  var continueBtn = document.getElementById("continueBtn");
  var playAgainBtn = document.getElementById("playAgainBtn");
  var backupBtn = document.getElementById("backupBtn");
  var backupOverlay = document.getElementById("backupOverlay");
  var backupCloseBtn = document.getElementById("backupCloseBtn");
  var backupCode = document.getElementById("backupCode");
  var copyBackupBtn = document.getElementById("copyBackupBtn");
  var restoreCode = document.getElementById("restoreCode");
  var restoreBtn = document.getElementById("restoreBtn");
  var leaderboardBtn = document.getElementById("leaderboardBtn");
  var leaderboardOverlay = document.getElementById("leaderboardOverlay");
  var leaderboardCloseBtn = document.getElementById("leaderboardCloseBtn");
  var leaderboardStatus = document.getElementById("leaderboardStatus");
  var leaderboardList = document.getElementById("leaderboardList");
  var changeNameBtn = document.getElementById("changeNameBtn");

  var cellEls = [];

  /* ---------------- shared leaderboard (Firebase Realtime Database) ---------------- */
  // FILL THESE IN with the values from your Firebase project's web app config.
  // The game works fine offline / without this filled in - the leaderboard
  // panel will just say it can't connect, everything else is unaffected.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDTCbeEOLCm4WW7q66UjPr2BNWyBl7PR7k",
    authDomain: "emberblock-95f8f.firebaseapp.com",
    databaseURL: "https://emberblock-95f8f-default-rtdb.firebaseio.com",
    projectId: "emberblock-95f8f"
  };
  var NAME_KEY = "emberblock100_player_name";
  var playerName = safeGet(NAME_KEY);
  var firebaseReady = false;
  var db = null;

  try {
    if (typeof firebase !== "undefined" && FIREBASE_CONFIG.apiKey.indexOf("PASTE_") === -1){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      firebaseReady = true;
    }
  } catch(e){ firebaseReady = false; }

  function ensurePlayerName(){
    if (playerName) return;
    var name = prompt("What's your name? (shown on the shared leaderboard)");
    if (name && name.trim()){
      playerName = name.trim().slice(0, 20);
      safeSet(NAME_KEY, playerName);
    }
  }

  function leaderboardKey(name){
    return name.replace(/[^a-zA-Z0-9_-]/g, "_");
  }

  function formatTimestamp(ms){
    var d = new Date(ms);
    var datePart = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    var timePart = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    return datePart + ", " + timePart;
  }

  function pushToLeaderboard(){
    if (!firebaseReady || !playerName) return;
    try {
      db.ref("leaderboard/" + leaderboardKey(playerName)).set({
        name: playerName,
        best: best,
        updatedAt: Date.now()
      });
    } catch(e){ /* offline or unreachable - fine, will retry on the next change */ }
  }

  function openLeaderboard(){
    leaderboardOverlay.classList.remove("hidden");
    leaderboardList.innerHTML = "";
    if (!firebaseReady){
      leaderboardStatus.textContent = "Leaderboard isn't set up yet.";
      return;
    }
    leaderboardStatus.textContent = "Loading\u2026";
    db.ref("leaderboard").once("value").then(function(snapshot){
      var val = snapshot.val() || {};
      var rows = Object.keys(val).map(function(k){ return val[k]; });
      rows.sort(function(a,b){ return (b.best||0) - (a.best||0); });
      if (rows.length === 0){
        leaderboardStatus.textContent = "No scores yet, be the first!";
        return;
      }
      leaderboardStatus.textContent = "";
      rows.forEach(function(row){
        var isYou = row.name === playerName;
        var line = document.createElement("div");
        line.style.padding = "8px 0";
        line.style.borderBottom = "0.5px solid #262e39";

        var topLine = document.createElement("div");
        topLine.style.display = "flex";
        topLine.style.justifyContent = "space-between";
        topLine.style.fontWeight = isYou ? "700" : "400";
        topLine.style.color = isYou ? "var(--ember-hi)" : "var(--text)";
        topLine.textContent = row.name + (isYou ? " (you)" : "");
        var scoreSpan = document.createElement("span");
        scoreSpan.textContent = (row.best||0).toLocaleString();
        topLine.appendChild(scoreSpan);
        line.appendChild(topLine);

        var timeLine = document.createElement("div");
        timeLine.style.fontSize = "11px";
        timeLine.style.color = "var(--text-dim)";
        timeLine.style.marginTop = "2px";
        timeLine.textContent = row.updatedAt ? formatTimestamp(row.updatedAt) : "";
        line.appendChild(timeLine);

        leaderboardList.appendChild(line);
      });
    }).catch(function(){
      leaderboardStatus.textContent = "Couldn't reach the leaderboard, check your connection.";
    });
  }

  leaderboardBtn.addEventListener("click", function(){
    ensurePlayerName();
    openLeaderboard();
  });
  leaderboardCloseBtn.addEventListener("click", function(){ leaderboardOverlay.classList.add("hidden"); });
  changeNameBtn.addEventListener("click", function(){
    var name = prompt("Enter a new name:", playerName || "");
    if (name && name.trim()){
      playerName = name.trim().slice(0, 20);
      safeSet(NAME_KEY, playerName);
      pushToLeaderboard();
      openLeaderboard();
    }
  });

  function buildBoardDom(){
    boardEl.innerHTML = "";
    cellEls = [];
    for (var r=0;r<SIZE;r++){
      var rowArr = [];
      for (var c=0;c<SIZE;c++){
        var d = document.createElement("div");
        d.className = "cell";
        d.dataset.r = r;
        d.dataset.c = c;
        boardEl.appendChild(d);
        rowArr.push(d);
      }
      cellEls.push(rowArr);
    }
  }

  function renderBoard(){
    for (var r=0;r<SIZE;r++){
      for (var c=0;c<SIZE;c++){
        cellEls[r][c].classList.toggle("filled", !!board[r][c]);
      }
    }
  }

  function renderScore(){
    scoreEl.textContent = score.toLocaleString();
    bestEl.textContent = best.toLocaleString();
    starsEl.textContent = stars.toLocaleString();
    rotateBtn.innerHTML = "Rotate (" + rotationCharges + ") \u00b7 Buy 50 " + STAR_ICON_SVG;
    rotateBtn.disabled = stars < ROTATION_COST;
  }

  /* ---------------- tray rendering ---------------- */
  var traySlotEls = Array.prototype.slice.call(document.querySelectorAll(".tray-slot"));

  function renderTray(){
    traySlotEls.forEach(function(slotEl, i){
      slotEl.innerHTML = "";
      var piece = tray[i];
      slotEl.classList.toggle("empty-slot", piece === null);
      slotEl.classList.toggle("rotatable", piece !== null && rotationCharges > 0);
      if (piece === null) return;
      var shape = getShape(piece);
      var grid = document.createElement("div");
      grid.className = "tray-piece";
      grid.style.gridTemplateColumns = "repeat(" + shape.w + ", 20px)";
      grid.style.gridTemplateRows = "repeat(" + shape.h + ", 20px)";
      var occupied = {};
      shape.cells.forEach(function(cell){ occupied[cell[0]+"_"+cell[1]] = true; });
      for (var r=0;r<shape.h;r++){
        for (var c=0;c<shape.w;c++){
          var tc = document.createElement("div");
          tc.className = "tcell" + (occupied[r+"_"+c] ? " on" : "");
          grid.appendChild(tc);
        }
      }
      slotEl.appendChild(grid);
    });
  }

  /* ---------------- placement logic ---------------- */
  function canPlace(shape, anchorR, anchorC){
    for (var i=0;i<shape.cells.length;i++){
      var r = anchorR + shape.cells[i][0];
      var c = anchorC + shape.cells[i][1];
      if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
      if (board[r][c]) return false;
    }
    return true;
  }

  function hasAnyPlacement(shape){
    for (var r=0;r<SIZE;r++){
      for (var c=0;c<SIZE;c++){
        if (canPlace(shape, r, c)) return true;
      }
    }
    return false;
  }

  function findClearedLines(){
    var rows = [];
    var cols = [];
    for (var r=0;r<SIZE;r++){
      if (board[r].every(Boolean)) rows.push(r);
    }
    for (var c=0;c<SIZE;c++){
      var full = true;
      for (var r2=0;r2<SIZE;r2++){ if (!board[r2][c]){ full=false; break; } }
      if (full) cols.push(c);
    }
    return { rows: rows, cols: cols };
  }

  function animateClear(cleared, done){
    var cells = [];
    cleared.rows.forEach(function(r){
      for (var c=0;c<SIZE;c++) cells.push(cellEls[r][c]);
    });
    cleared.cols.forEach(function(c){
      for (var r=0;r<SIZE;r++) cells.push(cellEls[r][c]);
    });
    cells.forEach(function(el){ el.classList.add("clearing"); });
    setTimeout(function(){
      cells.forEach(function(el){ el.classList.remove("clearing"); });
      done();
    }, 380);
  }

  function applyClear(cleared){
    cleared.rows.forEach(function(r){
      for (var c=0;c<SIZE;c++) board[r][c] = false;
    });
    cleared.cols.forEach(function(c){
      for (var r=0;r<SIZE;r++) board[r][c] = false;
    });
  }

  function updateBestIfNeeded(){
    if (score > best){
      best = score;
      bestWrap.classList.remove("pulse");
      void bestWrap.offsetWidth;
      bestWrap.classList.add("pulse");
      pushToLeaderboard();
    }
  }

  function maybeAwardStar(){
    if (pointsSinceLastStar >= STAR_THRESHOLD && clearedSinceLastStar){
      stars += bigClearSinceLastStar ? 2 : 1;
      pointsSinceLastStar = 0;
      clearedSinceLastStar = false;
      bigClearSinceLastStar = false;
      pulseStars();
    }
  }

  function pulseStars(){
    starsWrap.classList.remove("pulse");
    void starsWrap.offsetWidth;
    starsWrap.classList.add("pulse");
  }

  function commitPlacement(piece, anchorR, anchorC, slotIdx){
    var shape = getShape(piece);

    // rotation charge is only spent if the piece being placed was actually rotated
    if (piece.rot !== 0 && rotationCharges > 0){
      rotationCharges -= 1;
    }

    shape.cells.forEach(function(cell){
      board[anchorR+cell[0]][anchorC+cell[1]] = true;
    });
    var cellsPlaced = shape.cells.length;
    score += cellsPlaced;
    pointsSinceLastStar += cellsPlaced;
    renderBoard();
    renderScore();

    var cleared = findClearedLines();
    var lines = cleared.rows.length + cleared.cols.length;
    if (lines > 0){
      animateClear(cleared, function(){
        applyClear(cleared);
        var bonus = 10*lines + 5*lines*(lines-1);
        score += bonus;
        pointsSinceLastStar += bonus;
        clearedSinceLastStar = true;
        if (lines >= 3) bigClearSinceLastStar = true;
        renderBoard();
        updateBestIfNeeded();
        maybeAwardStar();
        if (board.every(function(row){ return row.every(function(v){ return !v; }); })){
          stars += 2;
          pulseStars();
        }
        renderScore();
        afterMoveHousekeeping(slotIdx);
      });
    } else {
      updateBestIfNeeded();
      maybeAwardStar();
      renderScore();
      afterMoveHousekeeping(slotIdx);
    }
  }

  function afterMoveHousekeeping(slotIdx){
    tray[slotIdx] = null;
    if (tray.every(function(v){ return v === null; })){
      refillTray();
    }
    renderTray();
    save();
    checkGameOver();
  }

  function checkGameOver(){
    var anyPlayable = tray.some(function(piece){
      return piece !== null && hasAnyPlacement(getShape(piece));
    });
    if (!anyPlayable){
      finalScoreEl.textContent = score.toLocaleString();
      newBestMsg.style.display = (score >= best && score > 0) ? "block" : "none";
      continueRow.style.display = (!hasUsedContinueThisGame && stars >= CONTINUE_COST) ? "flex" : "none";
      gameoverOverlay.classList.remove("hidden");
    }
  }

  /* ---------------- drag, tap-to-rotate & drop ---------------- */
  var CELL_PX = 0;
  var dragging = null;   // { slotIdx, baseId, rot, w, h, anchorR, anchorC, valid }
  var pendingTap = null; // { idx, startX, startY }
  var TAP_MOVE_THRESHOLD = 10;
  var LIFT = 78;

  function computeCellPx(){
    var rect = boardEl.getBoundingClientRect();
    return rect.width / SIZE;
  }

  function clearPreview(){
    for (var r=0;r<SIZE;r++){
      for (var c=0;c<SIZE;c++){
        cellEls[r][c].classList.remove("preview-valid","preview-invalid");
      }
    }
  }

  function showPreview(shape, anchorR, anchorC, valid){
    shape.cells.forEach(function(cell){
      var r = anchorR + cell[0], c = anchorC + cell[1];
      if (r>=0 && r<SIZE && c>=0 && c<SIZE){
        cellEls[r][c].classList.add(valid ? "preview-valid" : "preview-invalid");
      }
    });
  }

  function startDrag(slotIdx, piece, pointerX, pointerY){
    CELL_PX = computeCellPx();
    var shape = getShape(piece);
    dragging = { slotIdx: slotIdx, baseId: piece.baseId, rot: piece.rot, w: shape.w, h: shape.h, anchorR: -1, anchorC: -1, valid: false };

    traySlotEls[slotIdx].classList.add("dragging");

    ghostEl.innerHTML = "";
    ghostEl.style.gridTemplateColumns = "repeat(" + shape.w + ", " + CELL_PX + "px)";
    ghostEl.style.gridTemplateRows = "repeat(" + shape.h + ", " + CELL_PX + "px)";
    var occupied = {};
    shape.cells.forEach(function(cell){ occupied[cell[0]+"_"+cell[1]] = true; });
    for (var r=0;r<shape.h;r++){
      for (var c=0;c<shape.w;c++){
        var gc = document.createElement("div");
        gc.className = "gcell" + (occupied[r+"_"+c] ? " on" : "");
        ghostEl.appendChild(gc);
      }
    }
    ghostEl.style.opacity = "1";
    updateGhostPosition(pointerX, pointerY);
  }

  function updateGhostPosition(x, y){
    if (!dragging) return;
    var w = dragging.w * CELL_PX + (dragging.w-1)*3;
    var h = dragging.h * CELL_PX + (dragging.h-1)*3;
    var left = x - w/2;
    var top = y - h - LIFT;
    ghostEl.style.left = left + "px";
    ghostEl.style.top = top + "px";

    var probeX = left + CELL_PX/2;
    var probeY = top + CELL_PX/2;
    var el = document.elementFromPoint(probeX, probeY);
    var cellEl = el ? el.closest(".cell") : null;

    clearPreview();
    var shape = ROTATIONS[dragging.baseId][dragging.rot];
    if (cellEl){
      var r = parseInt(cellEl.dataset.r,10);
      var c = parseInt(cellEl.dataset.c,10);
      dragging.anchorR = r;
      dragging.anchorC = c;
      dragging.valid = canPlace(shape, r, c);
      showPreview(shape, r, c, dragging.valid);
    } else {
      dragging.anchorR = -1;
      dragging.anchorC = -1;
      dragging.valid = false;
    }
  }

  function endDrag(){
    if (!dragging) return;
    var d = dragging;
    traySlotEls[d.slotIdx].classList.remove("dragging");
    ghostEl.style.opacity = "0";
    clearPreview();
    if (d.valid){
      commitPlacement({ baseId: d.baseId, rot: d.rot }, d.anchorR, d.anchorC, d.slotIdx);
    } else {
      renderTray();
    }
    dragging = null;
  }

  function tryRotateTrayPiece(idx){
    if (rotationCharges <= 0) return;
    if (tray[idx] === null) return;
    tray[idx].rot = (tray[idx].rot + 1) % 4;
    renderTray();
    save();
  }

  traySlotEls.forEach(function(slotEl, idx){
    slotEl.addEventListener("pointerdown", function(e){
      if (tray[idx] === null) return;
      e.preventDefault();
      slotEl.setPointerCapture(e.pointerId);
      pendingTap = { idx: idx, startX: e.clientX, startY: e.clientY };
    });
    slotEl.addEventListener("pointermove", function(e){
      if (dragging && dragging.slotIdx === idx){
        updateGhostPosition(e.clientX, e.clientY);
        return;
      }
      if (pendingTap && pendingTap.idx === idx && !dragging){
        var dx = e.clientX - pendingTap.startX;
        var dy = e.clientY - pendingTap.startY;
        if (Math.sqrt(dx*dx + dy*dy) > TAP_MOVE_THRESHOLD){
          startDrag(idx, tray[idx], e.clientX, e.clientY);
        }
      }
    });
    slotEl.addEventListener("pointerup", function(e){
      if (dragging && dragging.slotIdx === idx){
        endDrag();
        pendingTap = null;
        return;
      }
      if (pendingTap && pendingTap.idx === idx){
        tryRotateTrayPiece(idx);
      }
      pendingTap = null;
    });
    slotEl.addEventListener("pointercancel", function(e){
      if (dragging && dragging.slotIdx === idx) endDrag();
      pendingTap = null;
    });
  });

  /* ---------------- controls ---------------- */
  rotateBtn.addEventListener("click", function(){
    if (stars < ROTATION_COST) return;
    stars -= ROTATION_COST;
    rotationCharges += 1;
    renderTray();
    renderScore();
    save();
  });

  function startNewGame(){
    board = newBoard();
    score = 0;
    hasUsedContinueThisGame = false;
    refillTray();
    renderBoard();
    renderTray();
    renderScore();
    save();
    gameoverOverlay.classList.add("hidden");
  }

  restartBtn.addEventListener("click", function(){
    if (score > 0 && !confirm("Start a new game? Your current board will be cleared.")) return;
    startNewGame();
  });
  playAgainBtn.addEventListener("click", startNewGame);

  continueBtn.addEventListener("click", function(){
    if (hasUsedContinueThisGame || stars < CONTINUE_COST) return;
    stars -= CONTINUE_COST;
    hasUsedContinueThisGame = true;
    for (var i=0;i<3;i++){ tray[i] = { baseId: 0, rot: 0 }; } // three fresh single blocks
    renderTray();
    renderScore();
    save();
    gameoverOverlay.classList.add("hidden");
    checkGameOver();
  });

  /* ---------------- backup / restore ---------------- */
  function openBackup(){
    var payload = serializeState();
    backupCode.value = btoa(unescape(encodeURIComponent(payload)));
    backupOverlay.classList.remove("hidden");
  }
  backupBtn.addEventListener("click", openBackup);
  backupCloseBtn.addEventListener("click", function(){ backupOverlay.classList.add("hidden"); });

  copyBackupBtn.addEventListener("click", function(){
    backupCode.select();
    backupCode.setSelectionRange(0, 99999);
    try {
      navigator.clipboard.writeText(backupCode.value);
      copyBackupBtn.textContent = "Copied!";
      setTimeout(function(){ copyBackupBtn.textContent = "Copy Code"; }, 1500);
    } catch(e){
      document.execCommand("copy");
    }
  });

  restoreBtn.addEventListener("click", function(){
    var code = restoreCode.value.trim();
    if (!code) return;
    try {
      var json = decodeURIComponent(escape(atob(code)));
      var obj = JSON.parse(json);
      if (!obj.board) throw new Error("bad save");
      applyState(obj);
      save();
      renderBoard();
      renderTray();
      renderScore();
      backupOverlay.classList.add("hidden");
      gameoverOverlay.classList.add("hidden");
      restoreCode.value = "";
    } catch(e){
      alert("That code didn't look right. Double check you copied the whole thing.");
    }
  });

  /* ---------------- boot ---------------- */
  buildBoardDom();
  loadOrInit();
  renderBoard();
  renderTray();
  renderScore();
  checkGameOver();
  if (playerName) pushToLeaderboard();

  window.addEventListener("resize", function(){ CELL_PX = computeCellPx(); });
})();
</script>
</body>
</html>
